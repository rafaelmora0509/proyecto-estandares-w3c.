<form name="formulario">
    
    <h1 style="color: crimson; text-align: center;">Formulario de Registro</h1> <br><br>
    <label for="numero">Número:</label>
    <input type="number" id="numero" name="numero">
    <br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email">

    <br><br>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <br><br>

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido">
    <br><br>
    <label for="ciudad" style="color:blue">Lugar de nacimiento:</label>
    <select id="lugar" name="lugar">
        <option value="portoviejo">portoviejo</option>
        <option value="chone">chone</option>
    </select> <br><br>

    <label for="fecha">Fecha de nacimiento:</label>
    <input type="date" id="fecha" name="fecha_nacimiento">
    <br><br>

    <label for="web">Página Web:</label>
    <input type="url" id="web" name="pagina_web">
    <br><br>
    <label for="color" style="color:blue">Color favorito:</label>
    <input type="color" id="color" name="color_favorito">
    <br><br>
    <label>¿Qué estándares de lenguajes de programación conoce?</label>
    <br><br>
    <input type="checkbox" id="html" name="estandar[]" value="HTML5">
    <label for="html">HTML</label><br><br>

    <input type="checkbox" id="css" name="estandar[]" value="CSS3">
    <label for="css">CSS</label><br><br>

    <input type="checkbox" id="js" name="estandar[]" value="JS">
    <label for="js">JavaScript</label><br><br>

    <input type="checkbox" id="php" name="estandar[]" value="PHP">
    <label for="php">PHP</label>
    <br><br>

    <label for="comentarios" style="color:blue">Comentarios:</label>
    <br><br>
    <textarea name="comentarios" rows="4" cols="50" placeholder="Ingrese sus comentarios aquí..."></textarea>
    <br><br>

    <input type="submit" value="Enviar">
    <input type="reset" value="Restablecer">
</form>
